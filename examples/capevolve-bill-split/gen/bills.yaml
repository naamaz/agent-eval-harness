# Each case: the story the skill sees, and the structured bill the gold answer is computed from.
# "clean" cases are ones the buggy seed script still gets right (gate stability).
case-001:
  story: "Ana and Ben had dinner. Ana had the steak ($30.00) and Ben had the pasta ($20.00). Tax is 10%. Tip 20% on the total after tax."
  bill: {diners: [Ana, Ben], tax_percent: 10, tip_percent: 20, tip_on: after_tax,
         items: [{name: Steak, price: 30.00, shared_by: [Ana]}, {name: Pasta, price: 20.00, shared_by: [Ben]}]}
