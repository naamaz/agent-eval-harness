# Demo benchmark for the cap-evolve integration: a dinner-bill splitter whose
# bundled script has bugs. See README.md.
name: bill-split-demo
description: Does the split-bill skill tell everyone the right amount to pay?

execution:
  mode: case
  skill: split-bill
  arguments: "{prompt}"
  timeout: 300
  max_budget_usd: 0.5

runner:
  type: claude-code
  permission_mode: acceptEdits   # headless runs must be allowed to write artifacts/

models:
  skill: claude-haiku-4-5

permissions:
  allow:
    # Let the skill run its bundled script (relative rules also get absolute-path twins).
    - "Bash(python3 .claude/skills/split-bill/scripts/split.py *)"
    - "Bash(python3 ./.claude/skills/split-bill/scripts/split.py *)"
  deny:
    - "mcp__*"
    # Keep the agent under test out of the answer key and the reference solution.
    - {path: eval/, tools: [Read, Grep, Glob]}
    - {path: gen/, tools: [Read, Grep, Glob]}

dataset:
  path: eval/dataset/cases
  schema: |
    Each case directory contains:
    - input.yaml: 'prompt' is a short story about a meal: who ate what, prices,
      tax rate, tip rate and whether the tip is on the pre-tax or post-tax amount.
    - annotations.yaml: gold 'total_cents' and 'shares_cents' per diner
      (generated by gen/build_dataset.py from gen/bills.yaml).

outputs:
  - path: artifacts
    schema: artifacts/split.md — a table of what each person owes

judges:
  - name: file_written
    description: 'artifacts/split.md exists and names every diner'
    check: |
      text = next((c for p, c in outputs.get("files", {}).items()
                   if p.endswith("split.md") and isinstance(c, str)), "")
      names = outputs.get("annotations", {}).get("shares_cents", {})
      missing = [n for n in names if n not in text]
      return bool(text) and not missing, "ok" if text and not missing else f"missing {missing or 'file'}"

  - name: adds_up
    description: 'The amounts in the table add up to the full bill, to the cent'
    check: |
      import re
      text = next((c for p, c in outputs.get("files", {}).items()
                   if p.endswith("split.md") and isinstance(c, str)), "")
      ann = outputs.get("annotations", {})
      got = 0
      for name in ann.get("shares_cents", {}):
          row = next((l for l in text.splitlines() if name in l and "|" in l), "")
          amounts = re.findall(r"\$?(\d+\.\d{2})", row)
          got += round(float(amounts[-1]) * 100) if amounts else 0
      return got == ann.get("total_cents"), f"sum {got}"

  - name: shares_correct
    description: 'Fraction of diners whose amount is right to the cent'
    score_range: [0, 1]
    check: |
      import re
      text = next((c for p, c in outputs.get("files", {}).items()
                   if p.endswith("split.md") and isinstance(c, str)), "")
      shares = outputs.get("annotations", {}).get("shares_cents", {})
      right = 0
      for name, cents in shares.items():
          row = next((l for l in text.splitlines() if name in l and "|" in l), "")
          amounts = re.findall(r"\$?(\d+\.\d{2})", row)
          right += bool(amounts) and round(float(amounts[-1]) * 100) == cents
      return right / max(len(shares), 1), f"{right}/{len(shares)}"

reward:
  formula: weighted
  weights:
    file_written: 1.0
    adds_up: 1.0
    shares_correct: 2.0
  gate: false
